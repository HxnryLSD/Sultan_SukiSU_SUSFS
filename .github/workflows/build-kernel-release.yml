name: Build and Release Sultan Kernels

permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions
  
on:
  workflow_dispatch:

# Never run two release builds at once: they would race on tag creation
# and artifact names.
concurrency:
  group: kernel-release
  cancel-in-progress: false
        
jobs:
  build-kernel-gs201:
    uses: ./.github/workflows/sultan.yml
    secrets: inherit
    with:
      codename: "gs201"
      android_version: "android14"
      kernel_version: "6.1"

  trigger-release:
    runs-on: ubuntu-latest
    needs:
        - build-kernel-gs201
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep in sync with env.SUSFS_VERSION in .github/workflows/sultan.yml
      SUSFS_VERSION: "2.1.0"
      RELEASE_NAME: "Sultan Kernels With SukiSU-Ultra & SUSFS v2.1.0"
      RELEASE_NOTES: |
        This release contains SukiSU-Ultra (susfs_new) with integrated SUSFS v${SUSFS_VERSION}
        
        ### 📦 Variants Included:
        * **stock**: The pure, unmodified base Sultan kernel. Built straight from source with no extra patches or additions.
        * **wksu**: Includes Wild KernelSU (WKSU) integrated into the kernel. No other modifications.
        * **wksu-susfs**: The ultimate package. Includes SukiSU-Ultra (branch: susfs_new) with integrated SUSFS v${SUSFS_VERSION}, and extra custom configurations (Mountify support, networking tweaks, BBR TCP congestion, and IPSet support).
        
        ⚠️ **COMPATIBILITY NOTICE** ⚠️
        Please ensure compatibility!
        
        **Sultan Commits Used:**
        -> https://github.com/TheWildJames/android_kernel_google_tensynos/commit/TENSYNOS_HASH
        
        Root Solution:
        -> https://github.com/SukiSU-Ultra/SukiSU-Ultra/tree/susfs_new
        
        Manager:
        -> https://github.com/SukiSU-Ultra/SukiSU_Manager
        
        Features:
        [+] SukiSU-Ultra (susfs_new)
        [+] SUSFS v${SUSFS_VERSION} (integrated)
        [+] Mountify Support
        [+] BBR TCP Congestion Control
        [+] IPSet Support

    outputs:
      new_tag: ${{ steps.generate-tag.outputs.new_tag }}

    steps:
      # Performance: this job only needs the tag list, release notes and the
      # built artifacts — not the kernel sources. Skipping the history fetch
      # keeps `git ls-remote`/tag creation fast (default is a full clone).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Get the Latest Tag from GitHub
      - name: Generate and Create New Tag
        id: generate-tag
        run: |
            # Fetch all tags and pick the highest one using version sort.
            # The /tags API does not guarantee "latest first", so sorting
            # locally with `sort -V` is required (v2.10.0 > v2.9.0).
            LATEST_TAG=$(gh api "repos/${{ github.repository }}/tags" --paginate \
              --jq '.[].name' | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v2.0.0-r0"  # Default starting tag if none exists yet
            fi

            # Increment only the trailing "-rN" revision suffix.
            # Anchored regex avoids mangling tags like "v2.0.0-rc1"
            # (a naive split on '-r' would treat "c1" as the revision).
            BASE="${LATEST_TAG}"
            REV=0
            if [[ "$LATEST_TAG" =~ ^(.*)-r([0-9]+)$ ]]; then
              BASE="${BASH_REMATCH[1]}"
              REV="${BASH_REMATCH[2]}"
            fi
            NEW_TAG="${BASE}-r$((REV + 1))"

            # Guard against clobbering an existing tag
            if gh api "repos/${{ github.repository }}/git/ref/tags/${NEW_TAG}" --jq .ref > /dev/null 2>&1; then
              echo "::error::Tag ${NEW_TAG} already exists; aborting."
              exit 1
            fi

            # Output the new tag to be used
            echo "New tag: $NEW_TAG"

            # Expose the tag as a step output (the reliable way to reference it
            # later via ${{ needs.trigger-release.outputs.new_tag }}) and also
            # set it as an environment variable for subsequent steps in this job.
            echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
            echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

            # Create the tag in the repository
            git tag $NEW_TAG
            git push origin $NEW_TAG

      # Download Artifacts for A12 (Only if A12 Build is successful or input is true or empty)
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./downloaded-artifacts

      - name: Fetch and Inject Sultan Commits
        run: |
          TENSYNOS_COMMIT=$(git ls-remote https://github.com/TheWildJames/android_kernel_google_tensynos HEAD | awk '{print $1}')
          
          # Replace placeholders in RELEASE_NOTES
          UPDATED_NOTES="${RELEASE_NOTES//TENSYNOS_HASH/$TENSYNOS_COMMIT}"
          
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "RELEASE_NOTES<<$EOF" >> $GITHUB_ENV
          echo "$UPDATED_NOTES" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      # Rename artifacts to include the release tag before uploading
      - name: Prepare Release Assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./release-assets
          shopt -s nullglob
          # Loop through all files in the downloaded-artifacts directory
          for file in ./downloaded-artifacts/kernel-*/*; do
              # Skip directories
              if [ -d "$file" ]; then
                  continue
              fi

              filename=$(basename "$file")
              name="${filename%.*}"
              ext="${filename##*.}"

              # Append the release tag version to the filename
              cp "$file" "./release-assets/${name}-${NEW_TAG}.${ext}"
          done

      # Create GitHub Release and upload assets
      # (actions/create-release@v1 is archived/unmaintained; use softprops/action-gh-release)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.trigger-release.outputs.new_tag }}  # Use the generated tag for the release
          name: ${{ env.RELEASE_NAME }}  # Pass the RELEASE_NAME to the action
          body: ${{ env.RELEASE_NOTES }}  # Pass the RELEASE_NOTES to the action
          files: ./release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Display Files Uploaded
      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/**/*
