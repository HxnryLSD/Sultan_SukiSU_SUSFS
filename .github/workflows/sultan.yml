name: Sultan
permissions:
  contents: write # Allow writing to repository contents (for pushing tags)
  actions: write # Allows triggering actions

env:
  SUSFS_VERSION: "2.1.0"

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      codename:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["stock", "wksu", "wksu-susfs"]
    steps:
      #- name: Maximize Build Space
      #  uses: AdityaGarg8/remove-unwanted-software@v5
      #  with:
      #    remove-dotnet: 'true'          # Frees ~2 GB
      #    remove-android: 'true'         # Frees ~9 GB
      #    remove-haskell: 'true'         # Frees ~5.2 GB
      #    remove-codeql: 'true'          # Frees ~5.4 GB
      #    remove-docker-images: 'true'   # Frees ~3.2 GB
      #    remove-large-packages: 'true'  # Frees ~3.1 GB
      #    remove-swapfile: 'true'        # Frees ~4 GB
      #    remove-cached-tools: 'false'   # Avoid unless confirmed safe
      #    verbose: 'true'                # Enable detailed logging

      # Performance: install the toolchain via a post-extraction cache key so
      # every job after the first restores the ready-to-use directory straight
      # from cache (no download + no multi-hundred-MB untar per job).
      - name: Cache GCC 14.2.0 toolchain
        id: gcc-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/gcc-14.2.0-nolibc
          key: gcc-14.2.0-nolibc-aarch64-linux-v2

      - name: Download and extract GCC 14.2.0 toolchain
        if: steps.gcc-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading GCC 14.2.0 cross-compiler toolchain..."
          wget -q https://www.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.xz
          echo "Extracting toolchain into workspace..."
          tar -xf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.xz -C "$GITHUB_WORKSPACE"
          rm -f x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.xz
          echo "GCC 14.2.0 toolchain extracted successfully"

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android_kernel_google_tensynos"

          # Set CONFIG as an environment variable for future steps
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

          echo "CONFIG set to: $CONFIG"

      # Performance: single shallow checkout step for all repos. The previous
      # setup cloned the kernel twice (once full-history, once depth=1), and
      # did a full clone of SukiSU-Ultra (~350 MB history) whose setup.sh only
      # needs the tip of susfs_new. Shallow clones cut several minutes of
      # network + disk I/O per matrix job.
      - name: Clone AnyKernel3 and Other Dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Cloning AnyKernel3 and other dependencies..."

          ANYKERNEL_BRANCH="sultan-${{ inputs.codename }}"

          # Debug print the branches
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"

          # All clones run in parallel; each is shallow since only the tip is used.
          # GIT_TERMINAL_PROMPT=0 makes git fail fast instead of hanging on an
          # interactive "Username for 'https://github.com'" prompt when a repo is
          # private/misnamed or GitHub rate-limits us (the cause of the exit 128).
          export GIT_TERMINAL_PROMPT=0

          # The kernel repo name depends on codename (e.g. gs201 -> tensynos,
          # zuma -> android_kernel_google_zuma). Derive it from the input so we
          # never clone a non-existent repo like "..._tensynos" for zuma builds.
          case "${{ inputs.codename }}" in
            gs201|gs201*) KERNEL_REPO="android_kernel_google_tensynos" ;;
            *)            KERNEL_REPO="android_kernel_google_${{ inputs.codename }}" ;;
          esac
          echo "Using kernel repo: $KERNEL_REPO"

          git clone --depth=1 https://github.com/TheWildJames/AnyKernel3.git -b "$ANYKERNEL_BRANCH" &
          pid_ak3=$!
          git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git &
          pid_kp=$!
          git clone --depth=1 "https://github.com/TheWildJames/$KERNEL_REPO" &
          pid_kern=$!
          # SUSFS is integrated into SukiSU-Ultra (branch: susfs_new) - no separate susfs4ksu repo needed
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git -b susfs_new &
          pid_sukisu=$!

          # Collect every clone's exit status so one failure doesn't mask others
          rc=0
          wait $pid_ak3    || { echo "::error::AnyKernel3 clone failed";    rc=1; }
          wait $pid_kp     || { echo "::error::kernel_patches clone failed"; rc=1; }
          wait $pid_kern   || { echo "::error::$KERNEL_REPO clone failed";   rc=1; }
          wait $pid_sukisu || { echo "::error::SukiSU_Ultra clone failed";   rc=1; }

          if [ $rc -ne 0 ]; then
            echo "One or more clones failed (exit 128 usually means a private/nonexistent"
            echo "repo, a wrong branch name, or GitHub rate-limiting anonymous access)."
            exit $rc
          fi

      - name: Add SukiSU-Ultra
        if: contains(matrix.features, 'wksu')
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Adding SukiSU-Ultra (susfs_new)..."
          # SukiSU-Ultra setup.sh on branch susfs_new integrates KernelSU + SUSFS support
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/susfs_new/kernel/setup.sh" | bash -s susfs_new

      - name: Apply SUSFS Patches
        if: contains(matrix.features, 'susfs')
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          # SUSFS kernel patches ship inside the SukiSU-Ultra susfs_new branch tree
          SUSFS_PATCH_DIR="../SukiSU-Ultra"

          echo "Applying SUSFS v${SUSFS_VERSION} patches from SukiSU-Ultra ($SUSFS_PATCH_DIR)..."

          # Copy SUSFS patches
          cp $SUSFS_PATCH_DIR/kernel_patches/fs/* ./fs/
          cp $SUSFS_PATCH_DIR/kernel_patches/include/linux/* ./include/linux/

          # libperfmgr redirect interacts badly with the raw patch context;
          # temporarily normalize fs/open.c, apply the patch, then restore it.
          perl -0pi -e 's/if \(IS_ERR\(f\) && !libperfmgr_redirect\(&f, dfd, tmp, &op, how\)\) \{/if (IS_ERR(f)) {/g' fs/open.c

          # ---- PATCH VALIDATION & AUTO-FIX ----
          # The SUSFS patch from susfs_new branch sometimes has malformed hunk headers
          # (e.g., "@@ -1919,6 +1933,10 @@" with mismatched line counts).
          # This step validates and attempts to fix common issues before applying.
          PATCH_FILE="$SUSFS_PATCH_DIR/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch"

          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Patch file not found: $PATCH_FILE"
            echo "Available patches:"
            ls -la "$SUSFS_PATCH_DIR/kernel_patches/" || true
            exit 1
          fi

          echo "Validating patch file: $PATCH_FILE"
          # Check for malformed hunk headers (missing space after @@, wrong format)
          if ! grep -q '^@@ .* @@$' "$PATCH_FILE"; then
            echo "::warning::Patch file may have malformed hunk headers, attempting auto-fix..."
            # Create a fixed copy
            FIXED_PATCH="${PATCH_FILE}.fixed"
            # Fix common issues: ensure space after @@ and before @@
            sed -E 's/^@@([^-+ ])/@@ \1/; s/([^-+ ])@@$/\1 @@/' "$PATCH_FILE" > "$FIXED_PATCH"
            # Validate hunk header format: @@ -old_start,old_count +new_start,new_count @@
            # If still invalid, show the problematic lines
            if ! grep -q '^@@ .* @@$' "$FIXED_PATCH"; then
              echo "::error::Patch file has unfixable malformed hunk headers:"
              grep -n '^@@' "$PATCH_FILE" | head -20
              exit 1
            fi
            PATCH_FILE="$FIXED_PATCH"
            echo "Using fixed patch: $PATCH_FILE"
          fi

          # Apply SUSFS patch. Do NOT swallow failures with "|| true": a failed
          # patch leaves .rej files and produces a silently broken kernel.
          patch -p1 --no-backup-if-mismatch < "$PATCH_FILE"

          # Verify the patch actually landed before continuing
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::SUSFS patch produced .rej files; aborting build."
            echo "Rejected hunks:"
            find . -name '*.rej' -exec echo "=== {} ===" \; -exec cat {} \;
            exit 1
          fi

          perl -0pi -e 's/if \(IS_ERR\(f\)\) \{/if (IS_ERR(f) && !libperfmgr_redirect(&f, dfd, tmp, &op, how)) {/g' fs/open.c

          # kernel/sys.c now ships with SukiSU-Ultra (susfs_new) hooks already applied;
          # legacy sys.c_fix.patch is obsolete and no longer applied.

      - name: Configure SukiSU-Ultra
        if: contains(matrix.features, 'wksu')
        run: |
          cd "$CONFIG"
          # KernelSU Configuration
          echo "# KernelSU Configuration" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          if [[ "${{ matrix.features }}" == *"susfs"* ]]; then
            echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
            # Enable the uname spoofing hooks shipped in kernel/sys.c; without this
            # the CONFIG_KSU_SUSFS_SPOOF_UNAME-guarded code compiles out and
            # spoof_uname from SUSFS has no effect.
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          else
            echo "CONFIG_KSU_MANUAL_HOOKS=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
            echo "CONFIG_KSU_SUSFS=n" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
            patch -p1 < ../kernel_patches/wild/hooks/69_pure_manual_hooks_only.patch
          fi

      - name: Configure Mountify Support
        if: matrix.features == 'wksu-susfs'
        run: |
          cd "$CONFIG"
          # Mountify Support
          echo "# Mountify Support" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_TMPFS_XATTR=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig

      - name: Configure Networking
        run: |
          cd "$CONFIG"
          # Networking Configuration
          echo "# Networking Configuration" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_IP_NF_TARGET_TTL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_IP6_NF_TARGET_HL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig
          echo "CONFIG_IP6_NF_MATCH_HL=y" >> ./arch/arm64/configs/${{ inputs.codename }}_defconfig

      - name: Add IP SET & IPv6_NAT Support
        shell: bash
        run: |
          cd "$CONFIG"
          cat >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig" << 'EOF'
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=65534
          CONFIG_IP_SET_BITMAP_IP=y
          CONFIG_IP_SET_BITMAP_IPMAC=y
          CONFIG_IP_SET_BITMAP_PORT=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPMARK=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_IPPORTIP=y
          CONFIG_IP_SET_HASH_IPPORTNET=y
          CONFIG_IP_SET_HASH_IPMAC=y
          CONFIG_IP_SET_HASH_MAC=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_IP_SET_HASH_NETNET=y
          CONFIG_IP_SET_HASH_NETPORT=y
          CONFIG_IP_SET_HASH_NETIFACE=y
          CONFIG_IP_SET_LIST_SET=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_IP6_NF_NAT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          EOF

      - name: Apply TCP Congestion Control
        shell: bash
        run: |
          cd "$CONFIG"
          cat >> "./arch/arm64/configs/${{ inputs.codename }}_defconfig" << 'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          EOF

      - name: Run sed and perl Commands
        if: matrix.features == 'wksu-susfs'
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Running sed commands..."
          sed -i 's/CONFIG_LOCALVERSION="-Sultan"/CONFIG_LOCALVERSION="-Sultan-Wild"/' ./arch/arm64/configs/${{ inputs.codename }}_defconfig

          sed -i '/echo "+"$/d' scripts/setlocalversion


      # Performance: ccache keeps compiled objects for the kernel sources that
      # are identical across the three matrix variants (stock/wksu/wksu-susfs
      # differ only in a handful of files), turning the 2nd and 3rd builds in
      # each run into mostly cache hits. Restored from cache between runs as
      # well, so re-runs / follow-up releases get faster still.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ inputs.codename }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ matrix.features }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.codename }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ matrix.features }}-
            ccache-${{ inputs.codename }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-

      - name: Build the Kernel
        shell: bash
        run: |
          set -euo pipefail
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          # 15 GB is plenty for one kernel tree; max_size avoids eviction churn.
          ccache --max-size=15G >/dev/null

          TOOLCHAIN="$GITHUB_WORKSPACE/gcc-14.2.0-nolibc/aarch64-linux/bin"

          make CROSS_COMPILE=$TOOLCHAIN/aarch64-linux- CC="ccache $TOOLCHAIN/aarch64-linux-gcc" -j$(nproc --all) ${{ inputs.codename }}_defconfig
          make CROSS_COMPILE=$TOOLCHAIN/aarch64-linux- CC="ccache $TOOLCHAIN/aarch64-linux-gcc" LOCALVERSION_AUTO=0 -j$(nproc --all)

          # Show hit rate so cache effectiveness can be tracked in the logs.
          ccache --show-stats

      - name: Save ccache
        # Only save on success: a failed/cancelled build leaves a partial or
        # inconsistent cache behind.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ inputs.codename }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ matrix.features }}-${{ github.sha }}

      - name: Copy Images
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"

          echo "Copying Image.lz4 and concatenating DTB files..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          #if [ "${{ inputs.codename }}" == "gs201" ]; then
          #  cat ./out/google-devices/gs201/dts/*.dtb > ../AnyKernel3/dtb
          #  #cp ./out/google-devices/gs201/dts/dtbo.img ../AnyKernel3/dtbo.img
          #elif [ "${{ inputs.codename }}" == "zuma" ]; then
          #  cat ./out/google-devices/zuma/dts/*.dtb > ../AnyKernel3/dtb
          #elif [ "${{ inputs.codename }}" == "zumapro" ]; then
          #  cat ./out/google-devices/zumapro/dts/*.dtb > ../AnyKernel3/dtb
          #fi

      - name: Create ZIP Files for Different Formats
        run: |
          echo "Navigating to AnyKernel3 directory..."
          cd ./AnyKernel3

          # Derive the Android major version (e.g. "android14" -> "a14") from
          # the workflow input instead of hardcoding it in the zip name.
          ANDROID_MAJOR="a$(echo "${{ inputs.android_version }}" | sed 's/^android//')"

          # Zip the files in the AnyKernel3 directory with a new naming convention
          # (-9 = max compression; these zips are downloaded by every user, so
          # trading ~free CPU time for smaller upload/download size is a win)
          ZIP_NAME="${{ inputs.codename }}-${ANDROID_MAJOR}-${{ matrix.features }}-anykernel3.zip"
          echo "Creating zip file $ZIP_NAME..."
          zip -9 -r "../$ZIP_NAME" ./*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ inputs.codename }}-${{ matrix.features }}
          path: |
            *.zip

      - name: Collect .rej files
        if: ${{ always() }}
        id: collect_rej
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"
          rm -rf rej
          mkdir -p rej

          found="false"
          while IFS= read -r -d '' rej_file; do
            found="true"
            original_file="${rej_file%.rej}"
            rej_rel="${rej_file#./}"
            original_rel="${original_file#./}"

            mkdir -p "rej/$(dirname "$rej_rel")"
            cp -f "$rej_file" "rej/$rej_rel"

            if [[ -f "$original_file" ]]; then
              mkdir -p "rej/$(dirname "$original_rel")"
              cp -f "$original_file" "rej/$original_rel"
            fi
          done < <(find . -type f -name '*.rej' -print0)

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Zip collected .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          zip -r "rej-${{ inputs.codename }}-${{ matrix.features }}.zip" rej

      - name: Upload .rej bundle
        if: ${{ always() && steps.collect_rej.outputs.found == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rej-${{ inputs.codename }}-${{ matrix.features }}
          path: |
            rej-${{ inputs.codename }}-${{ matrix.features }}.zip
